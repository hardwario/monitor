# HARDWARIO Monitor v2 - release (plan/features/0015 F2, plan/features/0031, ADR-0125, ADR-0120,
# ADR-0123, ADR-0224, ADR-0231).
#
# A pushed tag v2.X.Y (or v2.X.Y-<pre-release>) builds, signs and checksums the packages and
# creates a DRAFT GitHub release with generated notes; a maintainer reviews and publishes it
# (packaging/RELEASE.md). Nothing is published automatically.
#
#   gate          the version computed from the tag equals the tag, 0 unfinished translations (all
#                 languages), HWIO_TEST_OVERRIDES=OFF in the package configuration, and the full CI matrix
#                 (ci.yml through workflow_call, incl. the unsigned package jobs); the build and
#                 sign jobs run in parallel with it, publish waits for it (ADR-0231)
#   linux         Ubuntu 22.04 container: .deb + AppImage, checks, split DWARF symbols
#   macos         universal bundle, unsigned (artifact unsigned-macos), .dSYM symbols
#   windows       installed tree, unsigned (artifact unsigned-windows), .pdb symbols
#   sign-macos    bundle signed with the Developer ID (temporary keychain), the app notarized and
#                 stapled, then the DMG built from it, signed, notarized and stapled
#   sign-windows  executables signed with Azure Artifact Signing (OIDC), the MSI built from the
#                 signed tree (CPack WIX, no install scripts), the MSI signed
#   publish       every package present, SHA256SUMS, build provenance attestations, draft release
#
# ADR-0224: the build jobs run the compiler and every dependency's build code and never see a
# signing secret or an OIDC token. Only the two sign jobs run in the environment `signing` (it
# admits release tags v* only); they run this repository's packaging scripts and packaging tools
# (create-dmg, CPack, WiX), never a compiler. Hand-over: unsigned-* artifacts from the build jobs to
# the sign jobs; release-* artifacts go into the release. Variables, secrets and the Azure federated
# credential are in packaging/README.md. Every third-party action is pinned by its full commit SHA
# (tag in the comment), as in ci.yml.
name: Release

on:
  push:
    tags: ["v2.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"
  AQT_VERSION: "==3.3.0"
  LLVM_WINDOWS_VERSION: "21.1.8"
  LLVM_WINDOWS_SHA256: "7a5386c26497db1691f320121e5b113364dd0274b98e55f15f4dbc00c0450113"
  WIX_VERSION: "5.0.2"
  CREATE_DMG_VERSION: "1.2.2"
  CREATE_DMG_SHA256: "18e8dd7db06c9d6fb590c7877e1714b79b709f17d1d138bd65e4910cc82391bc"
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  gate:
    name: gate (version, translations, overrides)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: false
      - name: The version is the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v2\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Not a release tag: $tag" >&2; exit 1; }
          described="$(git describe --tags --match 'v2.*' --exact-match --dirty)"
          [ "$described" = "$tag" ] || { echo "git describe gives '$described', not '$tag'" >&2; exit 1; }
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install LLVM 21 and Qt build prerequisites
        # lld: the Linux linker (ADR-0207); the same retrying install as ci.yml.
        env:
          LLVM_MAJOR: "21"
        run: .github/install-llvm.sh clang-21 lld-21 ninja-build libgl1-mesa-dev libxkbcommon-dev
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          aqtversion: ${{ env.AQT_VERSION }}
          modules: qtconnectivity
          # Review L-5 (plan/features/0025): signed release artifacts never use Qt from the
          # Actions cache (a poisoned entry would feed the signed binaries).
          cache: false
      - name: Package configuration (version from the tag, HWIO_TEST_OVERRIDES=OFF)
        run: |
          cmake --preset linux-package | tee configure.log
          grep -q "HARDWARIO Monitor version: ${{ steps.version.outputs.version }} " configure.log
          grep -q '^HWIO_TEST_OVERRIDES:BOOL=OFF$' build/linux-package/CMakeCache.txt
      - name: 0 unfinished translations in every language (ADR-0027, ADR-0208)
        run: |
          cmake --preset linux-debug -DHWIO_BUILD_TESTS=OFF > /dev/null
          cmake --build --preset linux-debug --target check_translations | tee translations.log
          grep -q "Translations: 0 unfinished entries in all languages" translations.log

  tests:
    name: tests (ci.yml)
    needs: gate
    uses: ./.github/workflows/ci.yml

  linux:
    name: linux (.deb, AppImage)
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
      - name: Build image
        run: docker build -t hwio-monitor-build:22.04 -f packaging/linux/Containerfile packaging/linux
      - name: Build the .deb and the AppImage
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:$PWD" -w "$PWD" \
            -e CPM_SOURCE_CACHE="$PWD/.cpm-cache" hwio-monitor-build:22.04 \
            packaging/linux/build-packages.sh build/packages
      - name: Check the packages
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:$PWD" -w "$PWD" hwio-monitor-build:22.04 \
            packaging/linux/check-packages.sh build/packages
          packaging/linux/smoke-clean.sh build/packages
      - name: Symbols (split DWARF, ADR-0123)
        run: |
          version="${{ needs.gate.outputs.version }}"
          mkdir -p symbols
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:$PWD" -w "$PWD" hwio-monitor-build:22.04 bash -c '
            for exe in app/gui/hwio-monitor app/cli/hwio; do
              llvm-objcopy-21 --only-keep-debug "build/linux-package/$exe" "symbols/$(basename $exe).debug"
            done'
          (cd symbols && zip -9 "../build/packages/hwio-monitor-${version}-debug-symbols-linux.zip" *.debug)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: |
            build/packages/*.deb
            build/packages/*.AppImage
            build/packages/*-debug-symbols-linux.zip

  macos:
    name: macos (universal bundle, unsigned)
    needs: gate
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
      - name: Build tools
        run: brew install ninja
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          aqtversion: ${{ env.AQT_VERSION }}
          modules: qtconnectivity
          # Review L-5 (plan/features/0025): signed release artifacts never use Qt from the
          # Actions cache (a poisoned entry would feed the signed binaries).
          cache: false
      - name: Build and install
        run: |
          cmake --preset macos-package
          cmake --build --preset macos-package
          cmake --install build/macos-package --prefix "$PWD/build/macos-install"
      - name: Symbols (.dSYM, ADR-0123)
        run: |
          mkdir -p symbols build/packages
          dsymutil build/macos-package/app/gui/hwio-monitor.app/Contents/MacOS/hwio-monitor -o symbols/hwio-monitor.dSYM
          dsymutil build/macos-package/app/cli/hwio -o symbols/hwio.dSYM
          (cd symbols && zip -9 -r "../build/packages/hwio-monitor-${{ needs.gate.outputs.version }}-debug-symbols-macos.zip" .)
      # ditto keeps the bundle's symlinks, modes and extended attributes; a plain artifact upload
      # loses them.
      - name: Bundle for the sign job
        run: ditto -c -k --keepParent "build/macos-install/HARDWARIO Monitor.app" build/unsigned-macos.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-macos
          path: build/unsigned-macos.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-debug-symbols-macos
          path: build/packages/*-debug-symbols-macos.zip
          if-no-files-found: error

  windows:
    name: windows (installed tree, unsigned)
    needs: gate
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
      - name: Install LLVM ${{ env.LLVM_WINDOWS_VERSION }} (checksum verified)
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-$env:LLVM_WINDOWS_VERSION-win64.exe"
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_WINDOWS_VERSION/LLVM-$env:LLVM_WINDOWS_VERSION-win64.exe" -OutFile $installer
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($hash -ne $env:LLVM_WINDOWS_SHA256) { throw "LLVM installer checksum mismatch: $hash" }
          $target = "C:\llvm-$env:LLVM_WINDOWS_VERSION"
          Start-Process -FilePath $installer -ArgumentList "/S", "/D=$target" -Wait
          "$target\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          aqtversion: ${{ env.AQT_VERSION }}
          modules: qtconnectivity
          # Review L-5 (plan/features/0025): signed release artifacts never use Qt from the
          # Actions cache (a poisoned entry would feed the signed binaries).
          cache: false
      - name: Build and install (windeployqt, app-local MSVC runtime)
        run: |
          cmake --preset windows-package
          cmake --build --preset windows-package
          # Absolute: Qt runs windeployqt inside the prefix (as on macOS).
          cmake --install build/windows-package --prefix "$PWD/build/windows-install"
      - name: Symbols (.pdb, ADR-0123)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force symbols, build/packages | Out-Null
          Copy-Item build/windows-package/hwio-monitor.pdb, build/windows-package/hwio.pdb symbols/
          Compress-Archive -Path symbols/* -DestinationPath "build/packages/hwio-monitor-${{ needs.gate.outputs.version }}-debug-symbols-windows.zip"
      # The installed tree and what CPack needs to build the MSI from it in sign-windows
      # (packaging/windows/build-msi.ps1). The paths keep their place under build/.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-windows
          path: |
            build/windows-install/
            build/windows-package/CPackConfig.cmake
            build/windows-package/packaging/LICENSE.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-debug-symbols-windows
          path: build/packages/*-debug-symbols-windows.zip
          if-no-files-found: error

  # Signing jobs (ADR-0224): environment `signing`, tags only, no compiler, no dependency code.
  sign-macos:
    name: sign-macos (Developer ID, notarized DMG)
    needs: [gate, macos]
    if: github.ref_type == 'tag'
    runs-on: macos-15
    timeout-minutes: 150
    environment: signing
    permissions:
      contents: read
    env:
      APPLE_API_KEY: ${{ vars.APPLE_API_KEY || secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER || secrets.APPLE_API_ISSUER }}
      APP: build/macos-install/HARDWARIO Monitor.app
      DMG: build/packages/hwio-monitor-${{ needs.gate.outputs.version }}-macos-universal.dmg
    steps:
      # The packaging scripts, the entitlements and the DMG background (LFS).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: create-dmg ${{ env.CREATE_DMG_VERSION }} (checksum verified)
        run: |
          curl -fsSLo "$RUNNER_TEMP/create-dmg.tar.gz" \
            "https://github.com/create-dmg/create-dmg/archive/refs/tags/v${CREATE_DMG_VERSION}.tar.gz"
          echo "${CREATE_DMG_SHA256}  $RUNNER_TEMP/create-dmg.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/create-dmg.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/create-dmg-${CREATE_DMG_VERSION}" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-macos
          path: build/unsigned
      - name: Unpack the bundle
        run: |
          mkdir -p build/macos-install build/packages
          ditto -x -k build/unsigned/unsigned-macos.zip build/macos-install
          test -x "$APP/Contents/MacOS/hwio-monitor"
      - name: Signing identity (temporary keychain)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          trap 'rm -f "$RUNNER_TEMP/certificate.p12"' EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # In front of the existing keychains (xargs undoes their quotes).
          security list-keychains -d user | xargs security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | grep 'Developer ID Application' | head -n 1 | awk '{print $2}')"
          [ -n "$identity" ] || { echo "::error::No Developer ID Application identity in APPLE_CERTIFICATE"; exit 1; }
          echo "IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Sign the bundle (inside-out, hardened runtime, timestamp)
        run: packaging/macos/sign-and-notarize.sh sign "$APP" "$IDENTITY"
      - name: Notarize and staple the app
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: packaging/macos/sign-and-notarize.sh notarize-app "$APP"
      - name: DMG from the stapled app
        run: packaging/macos/sign-and-notarize.sh dmg "$APP" "$DMG" "$IDENTITY"
      - name: Notarize and staple the DMG
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: packaging/macos/sign-and-notarize.sh notarize "$DMG"
      - name: Verify the DMG and the app inside it
        run: packaging/macos/sign-and-notarize.sh verify-dmg "$DMG"
      - name: Remove the keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: build/packages/*.dmg
          if-no-files-found: error

  sign-windows:
    name: sign-windows (Artifact Signing, MSI)
    needs: [gate, windows]
    if: github.ref_type == 'tag'
    # The build job's image: CPackConfig.cmake holds absolute paths of that job's workspace and of
    # the image's CMake (packaging/windows/build-msi.ps1).
    runs-on: windows-2022
    timeout-minutes: 60
    environment: signing
    permissions:
      contents: read
      id-token: write # OIDC login to Azure (Artifact Signing, ADR-0120)
    env:
      MSI_NAME: hwio-monitor-${{ needs.gate.outputs.version }}-windows-x64.msi
    steps:
      # The packaging scripts and the WiX sources (template, features.wxs, icon in LFS).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: WiX ${{ env.WIX_VERSION }}
        shell: pwsh
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          wix extension add -g "WixToolset.UI.wixext/$env:WIX_VERSION"
          wix --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-windows
          path: build
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      # Our two executables in the installed tree, before the MSI is built from it. Qt DLLs and the
      # MSVC runtime are third-party files and keep their own signatures (ADR-0120).
      - name: Sign the executables
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://weu.codesigning.azure.net/
          signing-account-name: hardwario
          certificate-profile-name: hardwario
          files: |
            ${{ github.workspace }}\build\windows-install\hwio-monitor.exe
            ${{ github.workspace }}\build\windows-install\hwio.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: HARDWARIO Monitor
          description-url: https://github.com/hardwario/monitor
          # Only the Azure CLI login above; the others would be tried first.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: MSI from the signed tree
        shell: pwsh
        run: packaging/windows/build-msi.ps1 -BuildDir build/windows-package -Tree build/windows-install -OutDir build/packages
      - name: Sign the MSI
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://weu.codesigning.azure.net/
          signing-account-name: hardwario
          certificate-profile-name: hardwario
          files: ${{ github.workspace }}\build\packages\${{ env.MSI_NAME }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: HARDWARIO Monitor
          description-url: https://github.com/hardwario/monitor
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      # The two executables, the MSI and the executables inside the MSI (administrative install):
      # valid, signed by HARDWARIO a.s., timestamped. Then ICE validation.
      - name: Verify the signatures, ICE validation
        shell: pwsh
        run: |
          $msi = (Resolve-Path -LiteralPath "build/packages/$env:MSI_NAME").Path
          $extract = Join-Path $env:RUNNER_TEMP 'msi-admin'
          $admin = Start-Process -FilePath msiexec.exe -ArgumentList @('/a', "`"$msi`"", '/qn', "TARGETDIR=`"$extract`"") -Wait -PassThru
          if ($admin.ExitCode -ne 0) { throw "msiexec /a failed with exit code $($admin.ExitCode)" }
          $inside = @(Get-ChildItem -Path $extract -Recurse -File -Include hwio-monitor.exe, hwio.exe)
          if ($inside.Count -ne 2) { throw "Expected hwio-monitor.exe and hwio.exe in the MSI, found: $($inside.FullName -join ', ')" }
          $files = @('build/windows-install/hwio-monitor.exe', 'build/windows-install/hwio.exe', $msi) + $inside.FullName
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file
            '{0}: {1}, signed by {2}, timestamped by {3}' -f $file, $sig.Status, $sig.SignerCertificate.Subject, $sig.TimeStamperCertificate.Subject
            if ($sig.Status -ne 'Valid') { throw "${file}: $($sig.Status) $($sig.StatusMessage)" }
            if ($sig.SignerCertificate.Subject -notlike '*O=HARDWARIO a.s.*') { throw "${file}: signed by $($sig.SignerCertificate.Subject)" }
            if (-not $sig.TimeStamperCertificate) { throw "${file}: no timestamp" }
          }
          # ICE38/43/57: per-user checks, not for this perMachine MSI (as in ci.yml).
          wix msi validate -sice ICE38 -sice ICE43 -sice ICE57 $msi
          if ($LASTEXITCODE -ne 0) { throw "wix msi validate failed: $msi" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: build/packages/${{ env.MSI_NAME }}
          if-no-files-found: error

  publish:
    name: publish (checksums, attestations, draft release)
    needs: [gate, tests, linux, macos, windows, sign-macos, sign-windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write     # the draft release
      id-token: write     # build provenance attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Every package and debug symbol archive
        run: |
          v="${{ needs.gate.outputs.version }}"
          cd dist
          ls -l
          missing=0
          for f in "hwio-monitor-$v-x86_64.AppImage" "hardwario-monitor_${v}_amd64.deb" \
                   "hwio-monitor-$v-macos-universal.dmg" "hwio-monitor-$v-windows-x64.msi" \
                   "hwio-monitor-$v-debug-symbols-linux.zip" "hwio-monitor-$v-debug-symbols-macos.zip" \
                   "hwio-monitor-$v-debug-symbols-windows.zip"; do
            if [ ! -f "$f" ]; then echo "::error::missing $f"; missing=1; fi
          done
          exit $missing
      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [ "${{ needs.gate.outputs.prerelease }}" = "true" ]; then prerelease="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" \
            --draft $prerelease --generate-notes \
            --title "HARDWARIO Monitor ${{ needs.gate.outputs.version }}"
